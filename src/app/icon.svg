      <stop offset="0%" stop-color="#FFF0F0" />
      <stop offset="60%" stop-color="#FCE7E7" />
      <stop offset="100%" stop-color="#F2D1D1" />
    </radialGradient>
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E29494" />
      <stop offset="100%" stop-color="#C26A6A" />
