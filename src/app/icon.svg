  <!-- Delicate luxury sparkle at top right -->
  <path 
    d="M 23 8 Q 23 10.5 24.5 10.5 Q 23 10.5 23 13 Q 23 10.5 21.5 10.5 Q 23 10.5 23 8 Z" 
